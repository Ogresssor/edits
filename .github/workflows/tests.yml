name: Go core and media tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -count=1 -v ./internal/studio -run TestFFmpegIntegration
        env:
          EDITS_INTEGRATION: '1'
      - run: CGO_ENABLED=0 go build -trimpath -o edits ./cmd/edits
