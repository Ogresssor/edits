[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edits-studio"
version = "0.2.0"
description = "Local-first editorial workflow with immutable review and publication gates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
edits = "edits.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edits = ["fonts/*.ttf", "fonts/OFL.txt"]
